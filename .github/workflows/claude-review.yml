name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check for API key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against CLAUDE.md and the rules in .claude/rules/.
            Check in this order:
            1. RLS: every new table enables RLS, revokes all from anon and authenticated, grants explicitly, and has a policy per granted command.
            2. Tests: every new or changed policy has a pgTAP test for an allowed role and a denied role.
            3. security definer functions: empty search_path, schema-qualified names, execute revoked from public, anon and authenticated.
            4. No migration that is already on main has been edited.
            5. Edge Functions: input is validated, raw errors are never returned, and every status code has a test.
            6. Correctness bugs in the changed lines.

            Post each finding as an inline comment on the line it concerns, starting with [high], [medium] or [low].
            [high] means data exposed to the wrong role, a rule above broken, or wrong results. Skip style nits.
            Finish with one PR comment: the number of findings per severity, or "No high findings" if there are none.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # The action hides Claude's output. When the review fails, print only the
      # final result message so the reason is visible in the job log.
      - name: Show why the review failed
        if: failure() && steps.claude.outputs.execution_file != ''
        run: |
          jq -r '[.[] | select(.type == "result")] | last | .result // "no result message"' \
            "${{ steps.claude.outputs.execution_file }}" | head -c 2000
